<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Inventory</title>
 
  <!-- Tailwind CSS (CDN version, same tag as the rest of the app) -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
 
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link
    href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />
  <style>
    body { font-family: "Inter", sans-serif; }
  </style>
</head>
 
<body class="bg-white min-h-screen text-[#143967]">
  <div class="md:flex">
 
    <!-- ===================== SIDEBAR (desktop only) ===================== -->
    <aside class="hidden md:flex md:flex-col md:w-60 md:shrink-0 md:sticky md:top-0 md:h-screen bg-linear-to-b from-[#143967] to-[#0f3bb0] text-white p-5">
      <div class="flex items-center gap-2 mb-10">
        <span class="w-9 h-9 rounded-full bg-white flex items-center justify-center shrink-0"><img src="logo.png" alt="" class="h-5" /></span>
        <span class="font-bold text-[15px]">Stockwise Africa</span>
      </div>
      <nav id="sidebarNav" class="flex flex-col gap-1 text-[14px] flex-1" aria-label="Main navigation"></nav>
      <div id="sidebarFooter" class="flex flex-col gap-1 text-[14px]"></div>
    </aside>
 
    <!-- ===================== MAIN ===================== -->
    <main class="w-full max-w-[440px] md:max-w-none mx-auto flex-1 pb-28 md:pb-8">
 
      <!-- Mobile header -->
      <header class="md:hidden flex items-start justify-between px-5 pt-6 pb-4">
        <div>
          <h1 class="text-[20px] leading-tight font-bold text-black">Inventory</h1>
          <p id="totalLabel" class="text-[12px] text-black/60"></p>
        </div>
        <div class="flex items-center gap-4">
          <a href="notification.html" aria-label="Notifications"><svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="#143967" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 10a6 6 0 0 1 12 0c0 3 1 4 1 5H5c0-1 1-2 1-5zM10 18a2 2 0 0 0 4 0" /></svg></a>
          <svg class="w-9 h-9" viewBox="0 0 24 24" fill="#143967"><circle cx="12" cy="12" r="12" /><circle cx="12" cy="9.5" r="3.5" fill="#fff" /><path d="M5.5 19c1-3.5 4-4.5 6.5-4.5s5.5 1 6.5 4.5A11 11 0 0 1 12 23a11 11 0 0 1-6.5-4z" fill="#fff" /></svg>
        </div>
      </header>
 
      <!-- Desktop top bar: global search, bell, user -->
      <div class="hidden md:flex items-center gap-6 px-8 pt-6">
        <label class="flex-1 flex items-center gap-2 border border-[#143967]/20 rounded-[8px] px-3 py-2.5">
          <svg class="w-4 h-4 shrink-0" viewBox="0 0 24 24" fill="none" stroke="#143967" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7" /><path d="M20 20l-4-4" /></svg>
          <input id="globalSearch" type="search" placeholder="Search products, categories or SKU..." class="w-full bg-transparent text-[13px] placeholder-[#143967]/50 focus:outline-none" />
        </label>
        <a href="notification.html" aria-label="Notifications"><svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="#143967" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 10a6 6 0 0 1 12 0c0 3 1 4 1 5H5c0-1 1-2 1-5zM10 18a2 2 0 0 0 4 0" /></svg></a>
        <div class="flex items-center gap-2">
          <svg class="w-9 h-9" viewBox="0 0 24 24" fill="#143967"><circle cx="12" cy="12" r="12" /><circle cx="12" cy="9.5" r="3.5" fill="#fff" /><path d="M5.5 19c1-3.5 4-4.5 6.5-4.5s5.5 1 6.5 4.5A11 11 0 0 1 12 23a11 11 0 0 1-6.5-4z" fill="#fff" /></svg>
          <div class="leading-tight"><p class="text-[13px] font-semibold text-black">John Doe</p><p class="text-[11px] text-black/60">Owner</p></div>
        </div>
      </div>
 
      <!-- Desktop title row -->
      <div class="hidden md:flex items-center justify-between px-8 pt-5 pb-4">
        <h1 class="text-[26px] font-bold text-black">Inventory</h1>
        <a href="add.html" class="bg-[#143967] hover:bg-[#0f2c50] text-white text-[13px] font-bold rounded-[5px] px-4 py-2.5">+ Add Product</a>
      </div>
 
      <!-- Search + filters -->
      <section class="px-5 md:px-8 flex flex-col gap-3">
        <div class="flex items-center gap-2 md:flex-wrap">
          <label class="flex-1 md:flex-none md:w-52 flex items-center gap-2 bg-[#143967]/[6%] md:bg-white md:border md:border-[#143967]/20 rounded-[8px] px-3 py-2.5">
            <svg class="w-4 h-4 shrink-0" viewBox="0 0 24 24" fill="none" stroke="#143967" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7" /><path d="M20 20l-4-4" /></svg>
            <input id="search" type="search" placeholder="Search products, categories..." class="w-full bg-transparent text-[13px] placeholder-[#143967]/50 focus:outline-none" />
          </label>
 
          <!-- Mobile: this button shows/hides the category filter -->
          <button id="filterBtn" type="button" aria-label="Show filters" class="md:hidden w-10 h-10 shrink-0 rounded-[8px] bg-[#143967]/[6%] flex items-center justify-center">
            <svg class="w-4 h-4" viewBox="0 0 24 24" fill="#143967"><path d="M3 4h18l-7 8v7l-4 2v-9z" /></svg>
          </button>
 
          <select id="category" class="hidden md:block border border-[#143967]/20 rounded-[8px] px-3 py-2.5 text-[13px] bg-white focus:outline-none">
            <option value="all">All categories</option>
          </select>
          <select id="statusSelect" class="hidden md:block border border-[#143967]/20 rounded-[8px] px-3 py-2.5 text-[13px] bg-white focus:outline-none">
            <option value="all">All stock status</option>
            <option value="in">In stock</option>
            <option value="low">Low stock</option>
            <option value="out">Out of stock</option>
            <option value="expiring">Expiring soon</option>
          </select>
          <div class="hidden md:flex items-center gap-2 border border-[#143967]/20 rounded-[8px] px-3 py-2 text-[13px] bg-white">
            <svg class="w-4 h-4 shrink-0" viewBox="0 0 24 24" fill="none" stroke="#143967" stroke-width="1.5"><rect x="3" y="5" width="18" height="16" rx="2" /><path d="M3 10h18M8 3v4M16 3v4" /></svg>
            <input id="dateFrom" type="date" aria-label="Added from" class="bg-transparent focus:outline-none" />
            <span>-</span>
            <input id="dateTo" type="date" aria-label="Added to" class="bg-transparent focus:outline-none" />
          </div>
        </div>
 
        <!-- Mobile only: category dropdown opened by the filter button -->
        <select id="categoryMobile" class="hidden md:hidden border border-[#143967]/20 rounded-[8px] px-3 py-2.5 text-[13px] bg-white focus:outline-none">
          <option value="all">All categories</option>
        </select>
 
        <!-- Mobile only: status chips -->
        <div id="chips" class="md:hidden flex gap-2 overflow-x-auto pb-1 -mx-5 px-5"></div>
      </section>
 
      <!-- Mobile list -->
      <ul id="cards" class="md:hidden px-5 mt-3 divide-y divide-[#143967]/10"></ul>
 
      <!-- Desktop table -->
      <div class="hidden md:block px-8 mt-2">
        <div class="border border-[#143967]/10 rounded-[8px] overflow-x-auto">
          <table class="w-full text-[12px] text-center">
            <thead class="bg-[#143967]/[6%] text-[#143967]">
              <tr>
                <th class="p-3 w-10"><input id="selectAll" type="checkbox" aria-label="Select all products" /></th>
                <th class="p-3 font-semibold text-left">Product Name</th>
          <th class="p-3 font-semibold">Category</th>
          <th class="p-3 font-semibold">Selling Price</th>
          <th class="p-3 font-semibold">Current stock</th>
          <th class="p-3 font-semibold">Reorder level</th>
          <th class="p-3 font-semibold">Expiry date</th>
          <th class="p-3 font-semibold">Status</th>
          <th class="p-3 font-semibold">Actions</th>
              </tr>
            </thead>
            <tbody id="rows" class="divide-y divide-[#143967]/10"></tbody>
          </table>
        </div>
      </div>
 
      <!-- Empty state -->
      <div id="empty" class="hidden text-center px-5 py-16">
        <p class="font-bold text-[15px]">No products found</p>
        <p class="text-[12px] text-black/60 mt-1">Try a different search or clear the filters.</p>
        <button id="clearBtn" type="button" class="mt-4 bg-[#143967] text-white text-[13px] font-bold rounded-[5px] px-4 py-2.5">Clear filters</button>
      </div>
 
      <!-- Pagination -->
      <footer id="pager" class="px-5 md:px-8 mt-4 flex items-center justify-between text-[12px]">
        <p id="showing" class="text-black/60"></p>
        <div id="pages" class="flex items-center gap-1"></div>
      </footer>
    </main>
  </div>
 
  <!-- ===================== BOTTOM NAV (mobile only) ===================== -->
  <nav id="bottomNav" class="md:hidden fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-[440px] bg-white border-t border-black/10 flex items-center justify-between px-5 py-[10px]" aria-label="Main navigation"></nav>
  
 
  <script src="inventory.js"></script>
</body>
</html>
