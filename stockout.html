<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stock Out Confirmation</title>

    <!-- Tailwind CSS (CDN) -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- Google Fonts: Inter and Space Grotesk -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&display=swap"
      rel="stylesheet"
    />

    <!-- Small custom CSS: only fonts, because Tailwind has no class for these stacks -->
    <style>
      body {
        font-family: "Inter", sans-serif;
        background: #e5e7eb; /* grey page so the white screen is visible on desktop */
      }
      .font-sf {
        font-family: "SF Pro", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      .font-grotesk {
        font-family: "Space Grotesk", sans-serif;
      }
    </style>
  </head>

  <body class="m-0 overflow-x-hidden">
    <!--
      SCREEN: 440px x 956px, centred on wider screens.
      On narrower screens it shrinks in width (max-w-[440px] w-full)
      so there is no horizontal scrolling.
    -->
    <main class="relative mx-auto h-[956px] w-full max-w-[440px] overflow-hidden bg-white text-[#143967]">
     
      <!-- ============ 2. SUMMARY (centred in the screen) ============ -->
      <section class="absolute left-1/2 top-1/2 flex w-[calc(100%-40px)] max-w-[400px] -translate-x-1/2 -translate-y-1/2 flex-col items-center gap-[30px]">
        <!-- Success icon, heading and product -->
        <div class="flex w-full max-w-[332px] flex-col items-center gap-[10px]">
          <!-- Check-circle icon (50px) -->
          <svg width="50" height="50" viewBox="0 0 50 50" aria-hidden="true">
            <circle cx="25" cy="25" r="25" fill="#143967" />
            <path d="M14 26l8 8 15-16" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
          </svg>

          <h1 class="font-grotesk text-center text-[24px] font-bold leading-[31px] text-[#143967]">Stock updated successfully!</h1>

          <!-- Product summary -->
          <div class="flex w-[275px] items-start gap-[30px]">
            <!-- Image box 90x80. The fallback icon is hidden unless images.jpg fails to load (see script.js) -->
            <div class="relative h-[80px] w-[90px] shrink-0 overflow-hidden rounded-[5px] bg-[#143967]/10">
              <img id="productImage" src="sparacetamol.png" alt="Paracetamol 500mg" class="h-full w-full object-cover" />
              <div id="imageFallback" class="absolute inset-0 hidden items-center justify-center">
                <svg width="40" height="40" viewBox="0 0 40 40" fill="none" stroke="#143967" stroke-width="2" stroke-linejoin="round">
                  <rect x="5" y="5" width="30" height="30" rx="2" />
                  <circle cx="14" cy="14" r="3" />
                  <path d="M5 30l9-9 7 7 5-5 9 9" />
                </svg>
              </div>
            </div>

            <div class="flex h-[76px] w-[155px] flex-col items-start gap-[10px]">
              <h2 class="font-grotesk text-[16px] font-bold leading-[20px] text-[#143967]">Paracetamol 500mg</h2>
              <span class="flex h-[21px] items-center justify-center rounded-[7px] bg-[#143967]/10 px-[10px] py-[3px] text-[12px] font-semibold leading-[15px] text-[#143967]">SKU001</span>
              <p class="text-[12px] font-semibold leading-[15px] text-[#143967]">Tablet</p>
            </div>
          </div>
        </div>

        <!-- Details: stats card + buttons -->
        <div class="flex w-full flex-col items-center gap-[30px]">
          <!-- ============ 3. STOCK STATISTICS CARD ============ -->
          <div class="flex h-[127px] w-full flex-col justify-center gap-[10px] rounded-[7px] border border-[#143967]/20 px-[10px] py-[20px] text-[12px] font-semibold leading-[15px] text-[#143967]">
            <div class="flex items-center justify-between">
              <span>Previous stock</span>
              <span id="previousStock">48</span>
            </div>
            <hr class="m-0 border-0 border-t border-[#143967]/20" />
            <div class="flex items-center justify-between">
              <span>Removed quantity</span>
              <span id="removedQuantity">10</span>
            </div>
            <hr class="m-0 border-0 border-t border-[#143967]/20" />
            <div class="flex items-center justify-between">
              <span>New stock</span>
              <span id="newStock" class="font-extrabold">38</span>
            </div>
          </div>

          <!-- ============ 4. BUTTONS ============ -->
          <div class="flex w-full flex-col items-center justify-center gap-[10px]">
            <button id="viewProductBtn" type="button" class="flex h-[49px] w-full cursor-pointer items-center justify-center rounded-[5px] border border-[#143967] bg-[#143967] px-[20px] py-[15px] text-[14px] font-bold leading-[17px] text-white">
              View Product
            </button>
            <button id="backToInventoryBtn" type="button" class="flex h-[49px] w-full cursor-pointer items-center justify-center rounded-[5px] border border-[#143967] bg-white px-[20px] py-[15px] text-[14px] font-bold leading-[17px] text-[#143967]">
              Back to Inventory
            </button>
          </div>
        </div>
      </section>

      <!-- ============ 5. BOTTOM NAVIGATION ============ -->
      <nav class="font-sf absolute bottom-[28px] left-0 flex h-[61px] w-full items-center justify-between border-t border-[#6c6c6c]/20 bg-white p-[10px] text-[13.5px] leading-[19px] text-[#143967]" aria-label="Main navigation">
        <!-- Home -->
        <button type="button" data-nav="Home" class="flex h-[47px] w-[60px] cursor-pointer flex-col items-center justify-center rounded-[5px]">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="#143967" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round">
            <path d="M4 9l6-5.5L16 9v7.5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V9z" />
            <path d="M8 17.5v-5h4v5" />
          </svg>
          Home
        </button>

        <!-- Inventory (ACTIVE) -->
        <button type="button" data-nav="Inventory" class="flex h-[47px] w-[90px] cursor-pointer flex-col items-center justify-center rounded-[100px] bg-[#143967] py-[4px] text-white">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="#fff" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round">
            <rect x="4" y="2.5" width="12" height="15" rx="2" />
            <path d="M7 6.5h2M7 10h2M7 13.5h2M11.5 6.5H13M11.5 10H13M11.5 13.5H13" />
          </svg>
          Inventory
        </button>

        <!-- Sales -->
        <button type="button" data-nav="Sales" class="flex h-[47px] w-[60px] cursor-pointer flex-col items-center justify-center rounded-[5px]">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="#143967" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round">
            <rect x="4.5" y="2" width="11" height="16" rx="1.8" />
            <path d="M7 4.5h6" />
            <path d="M7 8.5h.01M10 8.5h.01M13 8.5h.01M7 11.5h.01M10 11.5h.01M7 14.5h.01M10 14.5h.01M13 11.5v3" />
          </svg>
          Sales
        </button>

        <!-- Alerts -->
        <button type="button" data-nav="Alerts" class="flex h-[47px] w-[60px] cursor-pointer flex-col items-center justify-center rounded-[5px]">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="#143967" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round">
            <path d="M5 8a5 5 0 0 1 10 0v3.5l1.5 3h-13L5 11.5V8z" />
            <path d="M8 16.5a2 2 0 0 0 4 0" />
          </svg>
          Alerts
        </button>

        <!-- More -->
        <button type="button" data-nav="More" class="flex h-[47px] w-[60px] cursor-pointer flex-col items-center justify-center rounded-[5px]">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="#143967">
            <circle cx="4.5" cy="5" r="1.4" /><circle cx="10" cy="5" r="1.4" /><circle cx="15.5" cy="5" r="1.4" />
            <circle cx="4.5" cy="10" r="1.4" /><circle cx="10" cy="10" r="1.4" /><circle cx="15.5" cy="10" r="1.4" />
            <circle cx="4.5" cy="15" r="1.4" /><circle cx="10" cy="15" r="1.4" /><circle cx="15.5" cy="15" r="1.4" />
          </svg>
          More
        </button>
      </nav>

    </main>

    <!-- All JavaScript lives in stockout.js -->
    <script src="stockout.js"></script>
  </body>
</html>
