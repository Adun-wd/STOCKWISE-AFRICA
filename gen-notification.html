<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="icon" href="data:," />
<title>Notifications | Stockwise Africa</title>
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet" />
<style>
  body { font-family: 'Inter', system-ui, sans-serif; color: #101828; }
  .font-heading { font-family: 'Space Grotesk', 'Inter', sans-serif; }
</style>
</head>
<body class="bg-white">
<div class="min-h-screen lg:flex">

  <aside class="flex flex-col gap-2 bg-gradient-to-b from-[#17396b] to-[#2358b8] p-4 text-white lg:sticky lg:top-0 lg:h-screen lg:w-60 lg:shrink-0 lg:p-5">
    <img src="https://res.cloudinary.com/gzmezpec/image/upload/v1791398404/stw.png" alt="Stockwise Africa" class="h-8 w-auto self-start lg:mb-6" />
    <nav id="nav" aria-label="Main" class="flex gap-1 overflow-x-auto lg:flex-col lg:overflow-visible"></nav>
    <div id="nav-bottom" class="flex gap-1 lg:mt-auto lg:flex-col"></div>
  </aside>

  <div class="flex min-h-screen min-w-0 flex-1 flex-col px-4 pb-4 pt-5 lg:px-6">
    <header class="flex items-center gap-4">
      <label class="relative flex-1">
        <span class="sr-only">Search</span>
        <svg class="pointer-events-none absolute left-3 top-1/2 -translate-y-1/2 text-slate-500" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m21 21-4-4"/></svg>
        <input type="search" placeholder="Search products, categories or SKU..." class="min-h-9 w-full rounded-md border border-slate-300 bg-white pl-9 pr-3 text-xs placeholder:text-slate-500 focus:border-[#17396b] focus:outline-none focus:ring-2 focus:ring-[#17396b]/20" />
      </label>
      <a href="notifications.html" id="bell" aria-label="Notifications" class="relative text-slate-800"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg><span id="bell-badge" class="absolute -right-1.5 -top-1.5 hidden min-w-4 rounded-full bg-red-500 px-1 text-center text-[9px] font-semibold leading-4 text-white"></span></a>
      <div class="flex items-center gap-2">
        <span class="flex h-8 w-8 items-center justify-center rounded-full bg-[#17396b] text-white" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0z"/></svg></span>
        <span class="text-xs leading-tight"><b class="block">John Doe</b><span id="user-role" class="font-semibold text-slate-600">Owner</span></span>
      </div>
    </header>

    <main class="mt-5 flex-1">
      <div class="flex flex-wrap items-start justify-between gap-3">
        <div>
          <h1 class="font-heading text-3xl font-bold text-[#17396b]">Notifications</h1>
          <p class="text-[11px] text-slate-600">Stay updated with important alerts and activities from your store.</p>
        </div>
        <button type="button" id="mark-all" class="flex min-h-9 items-center gap-2 rounded-md border border-[#17396b] bg-white px-4 text-xs font-semibold text-[#17396b] hover:bg-slate-50 disabled:opacity-50">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 5 5 9-10"/></svg>Mark all as read</button>
      </div>

      <div id="tabs" role="tablist" aria-label="Filter notifications" class="mt-3 inline-flex max-w-full gap-1 overflow-x-auto rounded-md bg-slate-200/70 p-1"></div>

      <ul id="list" class="mt-3 divide-y divide-slate-100 rounded-md border border-slate-200 bg-white"></ul>
      <div class="mt-3 flex flex-wrap items-center justify-between gap-2 text-[11px]">
        <p id="count" role="status"></p>
        <nav id="pager" aria-label="Pagination" class="flex gap-1"></nav>
      </div>
    </main>
  </div>
</div>

<script>
// Shared notifications for every page. Each page includes a copy of this code before its own script.
// Add a notification from any page:  Notify.add({ type: 'update', kind: 'sale', title: '...', message: '...', href: 'page.html' })
//   type: 'alert' | 'update' | 'system'     kind (picks the icon): 'low-stock' | 'expiry' | 'sync' | 'sale' | 'stock' | 'team'
const Notify = (() => {
  const KEY = 'notifications', LOW_STOCK_LEVEL = 10; // change LOW_STOCK_LEVEL once the real rule is agreed
  let mem = null; // used only if the browser blocks storage
  const raw = () => { try { const v = JSON.parse(localStorage.getItem(KEY)); if (v !== null) return v; } catch (e) {} return mem; };
  const save = (list) => { mem = list; try { localStorage.setItem(KEY, JSON.stringify(list)); } catch (e) {} };
  const ago = (h) => new Date(Date.now() - h * 3600e3).toISOString();
  const all = () => {
    if (raw() === null) save([ // sample notifications from the design, until the backend provides real ones
      { id: 's1', type: 'alert', kind: 'low-stock', title: 'Low stock alert', message: 'Paracetamol 500mg is running low (2 left).', href: 'stock-in.html', read: false, createdAt: ago(2) },
      { id: 's2', type: 'alert', kind: 'expiry', title: 'Product expiring soon', message: 'Multivitamin syrup will expire in 5 days.', href: 'product-details.html', read: false, createdAt: ago(4) },
      { id: 's3', type: 'alert', kind: 'sync', title: 'Sync issue', message: 'Failed to sync with server - retrying...', href: 'settings.html', read: false, createdAt: ago(6) },
      { id: 's4', type: 'update', kind: 'sale', title: 'New sale recorded', message: '₦1,800 - 2 items', href: 'sales.html', read: false, createdAt: ago(8) },
      { id: 's5', type: 'system', kind: 'team', title: 'Team member invited', message: 'Sarah Connor has been invited to join your team.', href: 'team.html', read: true, createdAt: ago(24) },
    ]);
    return raw() || [];
  };
  const unread = () => all().filter((n) => !n.read).length;
  const badge = () => {
    const b = document.getElementById('bell-badge'), bell = document.getElementById('bell'), c = unread();
    if (!b) return;
    b.textContent = c > 9 ? '9+' : c; b.classList.toggle('hidden', c === 0);
    if (bell) bell.setAttribute('aria-label', c ? `Notifications, ${c} unread` : 'Notifications');
  };
  const add = (n) => {
    const id = crypto.randomUUID ? crypto.randomUUID() : Date.now() + '-' + Math.random().toString(16).slice(2);
    save([{ id, read: false, createdAt: new Date().toISOString(), ...n }, ...all()]); badge();
  };
  // Losing the connection while changes are waiting is worth telling the user about
  window.addEventListener('offline', () => {
    let q = []; try { q = JSON.parse(localStorage.getItem('stockQueue')) || []; } catch (e) {}
    if (q.some((m) => !m.synced) && !all().some((n) => n.kind === 'sync' && !n.read))
      add({ type: 'alert', kind: 'sync', title: 'Sync issue', message: 'You are offline. Changes will sync when you reconnect.', href: 'settings.html' });
  });
  window.addEventListener('storage', badge);
  document.addEventListener('DOMContentLoaded', badge);
  return { all, save, add, unread, badge, LOW_STOCK_LEVEL };
})();
</script>
<script>
  const $ = (id) => document.getElementById(id);
  const ic = (d) => `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
  const I = {
    home: '<path d="m3 11 9-8 9 8"/><path d="M5 10v10h14V10"/>', inv: '<rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h3"/>',
    cart: '<circle cx="9" cy="20" r="1"/><circle cx="18" cy="20" r="1"/><path d="M2 3h3l3 12h11l2-8H6"/>', bell: '<path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/>',
    chart: '<path d="M3 3v18h18"/><path d="m7 15 4-4 3 3 5-6"/>', gear: '<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1"/>',
    out: '<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5M21 12H9"/>',
  };
  const item = (href, label, icon, o = {}) => `<a href="${href}" ${o.current ? 'aria-current="page"' : ''} ${o.id ? `id="${o.id}"` : ''} class="flex shrink-0 items-center gap-3 rounded-lg px-3 py-2.5 text-sm ${o.current ? 'bg-white font-medium text-[#17396b]' : (o.red ? 'text-red-300 hover:bg-white/10' : 'text-white hover:bg-white/10')}">${ic(I[icon])}${label}</a>`;
  $('nav').innerHTML = item('dashboard.html', 'Home', 'home', { current: true }) + item('inventory.html', 'Inventory', 'inv') + item('sales.html', 'Sales', 'cart') + item('alerts.html', 'Alerts', 'bell') + item('reports.html', 'Reports', 'chart');
  $('nav-bottom').innerHTML = item('settings.html', 'Settings', 'gear') + item('login.html', 'Logout', 'out', { red: true, id: 'logout' });
  $('logout').addEventListener('click', () => { try { sessionStorage.clear(); } catch (e) {} });
  try { const u = JSON.parse(sessionStorage.getItem('user')) || {}; if (u.role) $('user-role').textContent = u.role; } catch (e) {}

  const PAGE_SIZE = 10;
  let tab = 'all', page = 1, openMenu = null;
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const KIND = { // icon and colours for each kind of notification
    'low-stock': ['bg-red-50 text-red-500', '<path d="M12 3 2 20h20z"/><path d="M12 10v4M12 17h.01"/>'],
    expiry: ['bg-orange-50 text-orange-500', '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>'],
    sync: ['bg-indigo-50 text-indigo-500', '<path d="M3 12a9 9 0 0 1 15-6.7L21 8M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-15 6.7L3 16M3 21v-5h5"/>'],
    sale: ['bg-emerald-50 text-emerald-600', '<circle cx="9" cy="20" r="1"/><circle cx="18" cy="20" r="1"/><path d="M2 3h3l3 12h11l2-8H6"/>'],
    stock: ['bg-sky-50 text-sky-600', '<path d="m21 8-9-5-9 5v8l9 5 9-5z"/><path d="m3 8 9 5 9-5M12 13v8"/>'],
    team: ['bg-slate-100 text-slate-600', '<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>'],
  };
  const ago = (iso) => { const m = Math.max(0, Math.round((Date.now() - new Date(iso)) / 60000));
    if (m < 1) return 'just now'; if (m < 60) return `${m} minute${m === 1 ? '' : 's'} ago`;
    const h = Math.floor(m / 60); if (h < 24) return `${h} hour${h === 1 ? '' : 's'} ago`; const d = Math.floor(h / 24); return `${d} day${d === 1 ? '' : 's'} ago`; };

  const update = (fn) => { Notify.save(fn(Notify.all())); render(); Notify.badge(); };
  const filtered = () => Notify.all().filter((n) => tab === 'all' || n.type === tab);

  const render = () => {
    const list = Notify.all(), shown = filtered(), pages = Math.max(1, Math.ceil(shown.length / PAGE_SIZE));
    page = Math.min(page, pages);
    const tabs = [['all', 'All', list.length], ['alert', 'Alerts', list.filter((n) => n.type === 'alert').length], ['update', 'Updates', list.filter((n) => n.type === 'update').length], ['system', 'System', list.filter((n) => n.type === 'system').length]];
    $('tabs').innerHTML = tabs.map(([k, l, c]) => `<button role="tab" data-tab="${k}" aria-selected="${tab === k}" class="whitespace-nowrap rounded px-5 py-1.5 text-[10px] font-semibold ${tab === k ? 'bg-[#17396b] text-white' : 'text-slate-700 hover:bg-white/60'}">${l} (${c})</button>`).join('');
    $('mark-all').disabled = Notify.unread() === 0;

    const rows = shown.slice((page - 1) * PAGE_SIZE, page * PAGE_SIZE);
    $('list').innerHTML = rows.length ? rows.map((n) => { const [color, path] = KIND[n.kind] || KIND.team; return `
      <li class="relative flex flex-wrap items-center gap-3 px-3 py-3 sm:flex-nowrap ${n.read ? '' : 'bg-blue-50/30'}">
        <a href="${esc(n.href || '#')}" data-open="${n.id}" class="flex min-w-0 flex-1 items-center gap-3 focus:outline-none focus-visible:ring-2 focus-visible:ring-[#17396b]">
          <span class="flex h-8 w-8 shrink-0 items-center justify-center rounded-lg ${color}" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${path}</svg></span>
          <span class="min-w-0"><b class="block text-xs ${n.read ? 'font-medium' : ''}">${esc(n.title)}</b><span class="block truncate text-[11px] text-slate-600">${esc(n.message)}</span></span>
        </a>
        <span class="w-24 shrink-0 text-[11px] text-slate-600">${ago(n.createdAt)}</span>
        <span class="flex w-20 shrink-0 items-center gap-1.5 text-[11px]"><span class="h-1.5 w-1.5 rounded-full ${n.read ? 'bg-[#17396b]' : 'bg-red-500'}" aria-hidden="true"></span>${n.read ? 'Read' : 'Unread'}</span>
        <div class="relative">
          <button type="button" data-menu="${n.id}" aria-haspopup="menu" aria-expanded="${openMenu === n.id}" aria-label="Actions for ${esc(n.title)}" class="flex h-8 w-8 items-center justify-center rounded text-slate-700 hover:bg-slate-100">⋮</button>
          <div role="menu" class="${openMenu === n.id ? '' : 'hidden'} absolute right-0 z-10 mt-1 w-40 rounded-md border border-slate-200 bg-white py-1 text-xs shadow-lg">
            <button role="menuitem" data-toggle="${n.id}" class="block w-full px-3 py-2 text-left hover:bg-slate-50">Mark as ${n.read ? 'unread' : 'read'}</button>
            <button role="menuitem" data-delete="${n.id}" class="block w-full px-3 py-2 text-left text-red-600 hover:bg-slate-50">Delete</button>
          </div>
        </div>
      </li>`; }).join('') : '<li class="px-4 py-10 text-center text-xs text-slate-500">You have no notifications here.</li>';

    $('count').textContent = `Showing ${rows.length} of ${shown.length} notification${shown.length === 1 ? '' : 's'}`;
    $('pager').innerHTML = pages < 2 && shown.length <= PAGE_SIZE && page === 1 && pages === 1
      ? `<button class="h-6 w-6 rounded border border-slate-300" disabled aria-label="Previous page">‹</button><button class="h-6 w-6 rounded bg-[#17396b] text-white" aria-current="page">1</button><button class="h-6 w-6 rounded border border-slate-300" disabled aria-label="Next page">›</button>`
      : `<button data-page="${page - 1}" ${page === 1 ? 'disabled' : ''} class="h-6 w-6 rounded border border-slate-300 disabled:opacity-40" aria-label="Previous page">‹</button>` +
        Array.from({ length: pages }, (_, i) => `<button data-page="${i + 1}" ${i + 1 === page ? 'aria-current="page"' : ''} class="h-6 w-6 rounded ${i + 1 === page ? 'bg-[#17396b] text-white' : 'border border-slate-300'}">${i + 1}</button>`).join('') +
        `<button data-page="${page + 1}" ${page === pages ? 'disabled' : ''} class="h-6 w-6 rounded border border-slate-300 disabled:opacity-40" aria-label="Next page">›</button>`;
  };

  document.addEventListener('click', (e) => {
    const t = e.target.closest('button, a'); const menuBtn = e.target.closest('[data-menu]');
    if (!menuBtn && openMenu) { openMenu = null; render(); }
    if (!t) return;
    if (t.dataset.tab) { tab = t.dataset.tab; page = 1; render(); }
    else if (t.dataset.page) { page = Number(t.dataset.page); render(); }
    else if (t.dataset.menu) { openMenu = openMenu === t.dataset.menu ? null : t.dataset.menu; render(); }
    else if (t.dataset.toggle) { openMenu = null; update((l) => l.map((n) => n.id === t.dataset.toggle ? { ...n, read: !n.read } : n)); }
    else if (t.dataset.delete) { openMenu = null; update((l) => l.filter((n) => n.id !== t.dataset.delete)); }
    else if (t.id === 'mark-all') update((l) => l.map((n) => ({ ...n, read: true })));
    else if (t.dataset.open) { Notify.save(Notify.all().map((n) => n.id === t.dataset.open ? { ...n, read: true } : n)); } // opens the linked page
  });
  render();
</script>
</body>
</html>
