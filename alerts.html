<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Alerts</title>

  <!-- Tailwind CSS (CDN version, no build step needed) -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

  <!-- Space Grotesk for the heading, Inter for everything else -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link
    href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />

  <style>
    body {
      font-family: "Inter", sans-serif;
    }
    .font-heading {
      font-family: "Space Grotesk", sans-serif;
    }
    /* Hides the scrollbar on the filter pill row while still allowing
       it to scroll horizontally by touch, trackpad, or drag. */
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
  </style>
</head>

<body class="bg-white min-h-screen flex justify-center">

  <main class="w-full max-w-[440px] pb-28">

    <!-- ===================== HEADER ===================== -->
    <header class="flex items-start justify-between px-5 pt-6 gap-4">
      <div class="flex flex-col gap-[5px]">
        <h1 class="font-heading font-bold text-[20px] leading-[26px] text-[#143967]">Alerts</h1>
        <p class="text-[10px] leading-[12px] font-medium text-[#143967]">
          Stay on top of important updates and take action when needed.
        </p>
      </div>

      <div class="flex items-center gap-[10px] shrink-0">
        <!-- Notification bell with a small dot, matching the reference icon -->
        <button type="button" aria-label="Notifications" class="relative w-6 h-6">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" class="w-full h-full">
            <path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9" />
            <path d="M13.73 21a2 2 0 0 1-3.46 0" />
          </svg>
          <span class="absolute top-[1px] right-[1px] w-[6px] h-[6px] rounded-full bg-black"></span>
        </button>

        <!-- Profile avatar: a solid navy circle with a simple white person icon -->
        <button type="button" aria-label="Profile" class="w-9 h-9 rounded-full bg-[#143967] flex items-center justify-center">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="white" class="w-5 h-5">
            <circle cx="12" cy="8" r="4" />
            <path d="M4 20c0-4 4-6 8-6s8 2 8 6" />
          </svg>
        </button>
      </div>
    </header>

    <!-- ===================== STAT CARDS ===================== -->
    <section class="grid grid-cols-2 gap-[10px] px-5 mt-5">

      <!-- Low Stock -->
      <div class="border border-[#143967]/20 rounded-[10px] p-[10px] flex flex-col gap-[5px]">
        <div class="flex items-center gap-1">
          <span class="w-[22px] h-[22px] rounded-full bg-[#CD7D40]/20 flex items-center justify-center shrink-0">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" class="w-3 h-3">
              <path d="M12 2L1 21h22L12 2z" fill="#CD7D40" />
              <rect x="11" y="9" width="2" height="6" rx="1" fill="white" />
              <circle cx="12" cy="18" r="1.2" fill="white" />
            </svg>
          </span>
          <span class="text-[10px] leading-[12px] font-semibold text-[#143967]">Low Stock</span>
        </div>
        <p class="text-[20px] leading-[24px] font-bold text-[#143967]">7</p>
        <p class="text-[9px] leading-[11px] font-medium text-[#143967]">items need restocking</p>
      </div>

      <!-- Out of Stock -->
      <div class="border border-[#143967]/20 rounded-[10px] p-[10px] flex flex-col gap-[5px]">
        <div class="flex items-center gap-1">
          <span class="w-[22px] h-[22px] rounded-full bg-[#E85363]/20 flex items-center justify-center shrink-0">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="#E85363" class="w-3 h-3">
              <circle cx="12" cy="12" r="10" />
              <rect x="7" y="11" width="10" height="2" fill="white" />
            </svg>
          </span>
          <span class="text-[10px] leading-[12px] font-semibold text-[#143967]">Out of Stock</span>
        </div>
        <p class="text-[20px] leading-[24px] font-bold text-[#143967]">3</p>
        <p class="text-[9px] leading-[11px] font-medium text-[#143967]">items are out of stock</p>
      </div>

      <!-- Expiring Soon -->
      <div class="border border-[#143967]/20 rounded-[10px] p-[10px] flex flex-col gap-[5px]">
        <div class="flex items-center gap-1">
          <span class="w-[22px] h-[22px] rounded-full bg-[#CD7D40]/20 flex items-center justify-center shrink-0">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" class="w-3 h-3">
              <circle cx="12" cy="12" r="10" fill="#CD7D40" />
              <path d="M12 7v5l3 3" stroke="white" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          </span>
          <span class="text-[10px] leading-[12px] font-semibold text-[#143967]">Expiring Soon</span>
        </div>
        <p class="text-[20px] leading-[24px] font-bold text-[#143967]">4</p>
        <p class="text-[9px] leading-[11px] font-medium text-[#143967]">items will expire within 7 days</p>
      </div>

      <!-- Sync Issues -->
      <div class="border border-[#143967]/20 rounded-[10px] p-[10px] flex flex-col gap-[5px]">
        <div class="flex items-center gap-1">
          <span class="w-[22px] h-[22px] rounded-full bg-[#686CE4]/20 flex items-center justify-center shrink-0">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="#686CE4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="w-3 h-3">
              <path d="M4 12a8 8 0 0 1 14-5" />
              <path d="M20 12a8 8 0 0 1-14 5" />
              <path d="M18 4v3h-3M6 20v-3h3" />
            </svg>
          </span>
          <span class="text-[10px] leading-[12px] font-semibold text-[#143967]">Sync Issues</span>
        </div>
        <p class="text-[20px] leading-[24px] font-bold text-[#143967]">1</p>
        <p class="text-[9px] leading-[11px] font-medium text-[#143967]">Limited access (sales &amp; inventory)</p>
      </div>
    </section>

    <!-- ===================== FILTER PILLS ===================== -->
    <!-- Horizontally scrollable row. Clicking a pill filters the list below. -->
    <nav id="filterRow" class="no-scrollbar flex items-center gap-[10px] px-5 mt-5 overflow-x-auto pb-1">
      <button type="button" class="filter-pill shrink-0 px-[20px] py-[10px] rounded-[5px] text-[10px] leading-[12px] font-semibold bg-[#143967] text-white" data-filter="all">
        All (15)
      </button>
      <button type="button" class="filter-pill shrink-0 px-[20px] py-[10px] rounded-[5px] text-[10px] leading-[12px] font-semibold bg-[#143967]/10 text-[#143967]" data-filter="Low Stock">
        Low Stock (7)
      </button>
      <button type="button" class="filter-pill shrink-0 px-[20px] py-[10px] rounded-[5px] text-[10px] leading-[12px] font-semibold bg-[#143967]/10 text-[#143967]" data-filter="Out of Stock">
        Out of Stock (3)
      </button>
      <button type="button" class="filter-pill shrink-0 px-[20px] py-[10px] rounded-[5px] text-[10px] leading-[12px] font-semibold bg-[#143967]/10 text-[#143967]" data-filter="Expiring Soon">
        Expiring Soon (7)
      </button>
      <button type="button" class="filter-pill shrink-0 px-[20px] py-[10px] rounded-[5px] text-[10px] leading-[12px] font-semibold bg-[#143967]/10 text-[#143967]" data-filter="Sync Issue">
        Sync Issues (1)
      </button>
    </nav>

    <!-- ===================== ALERT LIST ===================== -->
    <!-- Cards are generated by app.js from the alertsData array, so adding
         a new alert only means adding one object to that list. -->
    <section id="alertList" class="flex flex-col gap-[5px] px-5 mt-5"></section>

    <!-- ===================== BOTTOM NAV BAR ===================== -->
    <nav class="fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-[440px] bg-white border-t border-black/10 flex items-center justify-between px-5 py-[10px]">

      <button type="button" class="flex flex-col items-center justify-center gap-1 text-[#143967]">
        <svg class="w-5 h-5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1v-9z" />
        </svg>
        <span class="text-[13.5px]">Home</span>
      </button>

      <button type="button" class="flex flex-col items-center justify-center gap-1 text-[#143967]">
        <svg class="w-5 h-5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <rect x="4" y="4" width="16" height="16" rx="2" />
          <path d="M8 9h8M8 13h5" />
        </svg>
        <span class="text-[13.5px]">Inventory</span>
      </button>

      <button type="button" class="flex flex-col items-center justify-center gap-1 text-[#143967]">
        <svg class="w-5 h-5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <rect x="4" y="3" width="16" height="18" rx="2" />
          <path d="M7 7h10M7 11h3M12 11h3M17 11h0M7 15h3M12 15h3M17 15h0" />
        </svg>
        <span class="text-[13.5px]">Sales</span>
      </button>

      <!-- Alerts is the active tab on this screen: navy pill, white icon/text -->
      <button type="button" class="flex flex-col items-center justify-center gap-1 px-[15px] py-1 rounded-full bg-[#143967] text-white">
        <svg class="w-5 h-5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M6 10a6 6 0 0 1 12 0c0 3 1 4 1 5H5c0-1 1-2 1-5z" />
          <path d="M10 18a2 2 0 0 0 4 0" />
        </svg>
        <span class="text-[13.5px]">Alerts</span>
      </button>

      <button type="button" class="flex flex-col items-center justify-center gap-1 text-[#143967]">
        <svg class="w-5 h-5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="#143967">
          <circle cx="4" cy="4" r="1.7" />
          <circle cx="10" cy="4" r="1.7" />
          <circle cx="16" cy="4" r="1.7" />
          <circle cx="4" cy="10" r="1.7" />
          <circle cx="10" cy="10" r="1.7" />
          <circle cx="16" cy="10" r="1.7" />
          <circle cx="4" cy="16" r="1.7" />
          <circle cx="10" cy="16" r="1.7" />
          <circle cx="16" cy="16" r="1.7" />
        </svg>
        <span class="text-[13.5px]">More</span>
      </button>
    </nav>
  </main>

  <script src="alerts.js"></script>
</body>
</html>
