<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stock Out</title>

    <!-- Tailwind CSS (CDN) -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- Google Fonts: Inter and Space Grotesk -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&display=swap"
      rel="stylesheet"
    />

    <!-- Small custom CSS: only what Tailwind classes can't do easily -->
    <style>
      /* Default font for the whole screen */
      body {
        font-family: "Inter", sans-serif;
        background: #e5e7eb; /* grey page so the white 440px screen is visible on desktop */
      }

      /* Font used only for the bottom navigation labels */
      .font-sf {
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display",
          "SF Pro Text", sans-serif;
      }

      /* Placeholder text color from the design: rgba(20,57,103,0.6) */
      textarea::placeholder {
        color: rgba(20, 57, 103, 0.6);
      }
    </style>
  </head>

  <body class="m-0">
    <!--
      SCREEN: fixed 440px x 956px, white background.
      "relative" lets us place the children with absolute positions
      exactly like the Figma design (left / top values).
    -->
    <main class="relative mx-auto h-[956px] w-[440px] overflow-hidden bg-white text-[#143967]">

      <!-- ============ 2. INVENTORY HEADER ============ -->
      <header class="absolute left-[20px] top-[62px] flex h-[36px] w-[400px] items-center justify-between">
        <div class="flex items-center gap-[20px]">
          <!-- Back button -->
          <button id="backBtn" type="button" aria-label="Go back" class="flex h-[16px] w-[16px] cursor-pointer items-center justify-center">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#000" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M14 8H2" />
              <path d="M7 3L2 8l5 5" />
            </svg>
          </button>
          <h1 class="text-[14px] font-bold leading-[17px] text-black">Inventory</h1>
        </div>

        <div class="flex items-center justify-end gap-[10px]">
          <!-- Notification bell -->
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-label="Notifications">
            <path d="M6 10a6 6 0 0 1 6-6" />
            <path d="M18 12v3l1.5 2.5h-15L6 15v-5" />
            <path d="M10 20a2 2 0 0 0 4 0" />
            <circle cx="18" cy="6" r="2.5" fill="#000" stroke="none" />
          </svg>
          <!-- User avatar (36px) -->
          <svg width="36" height="36" viewBox="0 0 36 36" aria-label="User profile">
            <circle cx="18" cy="18" r="18" fill="#143967" />
            <circle cx="18" cy="13.5" r="5" fill="#fff" />
            <path d="M8.5 27c0-4.6 4.2-7 9.5-7s9.5 2.4 9.5 7c-2.4 2.6-5.6 4-9.5 4s-7.1-1.4-9.5-4z" fill="#fff" />
          </svg>
        </div>
      </header>

      <!-- ============ 3. PRODUCT DETAILS ============ -->
      <section class="absolute left-[20px] top-[108px] flex h-[71px] w-[255px] items-center gap-[20px]">
        <img src="paracetamol.png" alt="Paracetamol 500mg" class="h-[71px] w-[80px] shrink-0 rounded-[5px] object-cover" />
        <div class="flex w-[155px] flex-col gap-[10px]">
          <h2 class="font-['Space_Grotesk'] text-[16px] font-bold leading-[20px] text-[#143967]">Paracetamol 500mg</h2>
          <p class="text-[12px] font-semibold leading-[15px] text-[#143967]">
            Current stock: <span id="currentStockLabel">48</span>
          </p>
        </div>
      </section>

      <!-- ============ 4. QUICK ACTIONS ============ -->
      <nav class="absolute left-[20px] top-[194px] flex w-[400px] flex-col gap-[10px]" aria-label="Quick actions">
        <!-- Row 1 -->
        <div class="flex h-[34px] items-center justify-between">
          <!-- Record Sale -->
          <button id="recordSaleBtn" type="button" class="flex h-[34px] w-[98px] cursor-pointer items-center gap-[5px] rounded-[5px] border border-[#143967] p-[10px] text-[10px] font-bold leading-[12px] text-[#143967]">
            <svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="#143967" stroke-width="1" stroke-linecap="round" stroke-linejoin="round">
              <path d="M0.6 1h1.6l1.2 6h5.6l1-4.2H2.6" />
              <circle cx="4.2" cy="9.6" r="0.8" />
              <circle cx="8.6" cy="9.6" r="0.8" />
            </svg>
            Record Sale
          </button>

          <!-- Add Stock -->
          <button id="addStockBtn" type="button" class="flex h-[34px] w-[90px] cursor-pointer items-center gap-[5px] rounded-[5px] border border-[#143967] p-[10px] text-[10px] font-bold leading-[12px] text-[#143967]">
            <svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="#143967" stroke-width="0.9" stroke-linecap="round">
              <circle cx="6" cy="6" r="5.3" />
              <path d="M6 3.6v4.8M3.6 6h4.8" />
            </svg>
            Add Stock
          </button>

          <!-- Remove Stock (ACTIVE) -->
          <button id="removeStockBtn" type="button" class="flex h-[34px] w-[109px] cursor-pointer items-center gap-[5px] rounded-[5px] border border-[#143967] bg-[#143967] p-[10px] text-[10px] font-bold leading-[12px] text-white">
            <svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="#fff" stroke-width="0.9" stroke-linecap="round">
              <circle cx="6" cy="6" r="5.3" />
              <path d="M3.6 6h4.8" />
            </svg>
            Remove Stock
          </button>

          <!-- Edit Product -->
          <button id="editProductBtn" type="button" class="flex h-[34px] w-[100px] cursor-pointer items-center gap-[5px] rounded-[5px] border border-[#143967]/40 p-[10px] text-[10px] font-bold leading-[12px] text-[#143967]">
            <svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="#143967" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
              <path d="M2 10l.5-2.3L8 2.2a1 1 0 0 1 1.4 0l.4.4a1 1 0 0 1 0 1.4L4.3 9.5 2 10z" />
            </svg>
            Edit Product
          </button>
        </div>

        <!-- Row 2 -->
        <button id="viewInventoryBtn" type="button" class="flex h-[34px] w-[400px] cursor-pointer items-center justify-center gap-[5px] rounded-[5px] border border-[#143967]/40 p-[10px] text-[10px] font-bold leading-[12px] text-[#143967]">
          <svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="#143967" stroke-width="1.3">
            <path d="M1 6c1.2-2.2 2.9-3.2 5-3.2S9.8 3.8 11 6c-1.2 2.2-2.9 3.2-5 3.2S2.2 8.2 1 6z" />
            <circle cx="6" cy="6" r="1.2" fill="#143967" />
          </svg>
          View Stock Inventory
        </button>
      </nav>

      <!-- ============ 5. STOCK OUT FORM ============ -->
      <form id="stockOutForm" class="absolute left-[20px] top-[292px] flex w-[400px] flex-col gap-[15px]">
        <!-- QUANTITY SECTION -->
        <div class="flex h-[96px] flex-col gap-[10px]">
          <label class="text-[12px] font-semibold leading-[15px] text-[#143967]">Quantity to remove</label>

          <div class="flex h-[71px] w-[400px] items-center justify-between rounded-[10px] border border-[#143967]/20 px-[15px] py-[20px]">
            <!-- The quantity number (script.js changes this) -->
            <span id="quantityDisplay" class="text-[24px] font-bold leading-[29px] text-[#143967]">10</span>

            <div class="flex items-center gap-[10px]">
              <!-- Minus -->
              <button id="minusBtn" type="button" aria-label="Decrease quantity" class="flex h-[26px] w-[30px] cursor-pointer items-center justify-center rounded-[5px] border border-[#143967]/40">
                <svg width="16" height="16" viewBox="0 0 16 16" fill="#143967"><rect x="4" y="7.5" width="8" height="1" /></svg>
              </button>
              <!-- Plus -->
              <button id="plusBtn" type="button" aria-label="Increase quantity" class="flex h-[26px] w-[30px] cursor-pointer items-center justify-center rounded-[5px] border border-[#143967]/40">
                <svg width="16" height="16" viewBox="0 0 16 16" fill="#143967"><rect x="4" y="7.5" width="8" height="1" /><rect x="7.5" y="4" width="1" height="8" /></svg>
              </button>
            </div>
          </div>
        </div>

        <!-- REASON SECTION -->
        <div class="flex h-[73px] flex-col gap-[10px]">
          <label for="reasonSelect" class="text-[12px] font-semibold leading-[15px] text-[#143967]">Reason (Optional)</label>

          <!-- relative wrapper so the custom chevron can sit on top of the select -->
          <div class="relative h-[48px] w-[400px]">
            <select id="reasonSelect" class="h-[48px] w-[400px] cursor-pointer appearance-none rounded-[5px] border border-[#143967]/20 bg-white px-[15px] text-[12px] font-semibold text-[#143967] outline-none">
              <option value="Expired product" selected>Expired product</option>
              <option value="Damaged product">Damaged product</option>
              <option value="Lost product">Lost product</option>
              <option value="Returned product">Returned product</option>
              <option value="Other">Other</option>
            </select>
            <!-- Custom chevron (clicks pass through to the select) -->
            <svg class="pointer-events-none absolute right-[15px] top-[16px]" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#143967" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 5.5l5 5 5-5" />
            </svg>
          </div>
        </div>

        <!-- NOTE SECTION -->
        <div class="flex h-[111px] flex-col gap-[5px]">
          <label for="noteInput" class="text-[12px] font-semibold leading-[15px] text-[#143967]">Note (optional)</label>
          <!-- resize-none = user cannot resize the box -->
          <textarea id="noteInput" placeholder="e.g. damaged goods, expired etc." class="h-[91px] w-[400px] resize-none rounded-[7px] border border-[#143967]/20 px-[15px] py-[10px] text-[12px] font-medium text-[#143967] outline-none"></textarea>
        </div>

        <!-- NEW STOCK QUANTITY -->
        <div class="flex h-[91px] w-[400px] items-center gap-[15px] rounded-[7px] bg-[#143967]/10 px-[15px] py-[20px]">
          <!-- Info icon -->
          <svg width="30" height="30" viewBox="0 0 30 30" fill="none" stroke="#143967" stroke-width="2.2" stroke-linecap="round">
            <circle cx="15" cy="15" r="12.5" />
            <path d="M15 13.5v7" />
            <circle cx="15" cy="9.6" r="0.6" fill="#143967" />
          </svg>
          <div class="flex w-[131px] flex-col justify-center gap-[10px]">
            <p class="text-[14px] font-semibold leading-[17px] text-[#143967]">New stock quantity</p>
            <p id="newStockDisplay" class="text-[20px] font-bold leading-[24px] text-[#143967]">38</p>
          </div>
        </div>

        <!-- CONFIRM BUTTON -->
        <button id="confirmBtn" type="submit" class="flex h-[49px] w-[400px] cursor-pointer items-center justify-center rounded-[5px] border border-[#143967] bg-[#143967] px-[20px] py-[15px] text-[14px] font-bold leading-[17px] text-white">
          Confirm
        </button>

        <!-- Confirmation message (hidden until Confirm is clicked).
             It sits in the free space between the form and the bottom nav. -->
        <p id="confirmMessage" role="status" class="hidden w-[400px] rounded-[5px] bg-[#143967]/10 px-[12px] py-[8px] text-[12px] font-semibold leading-[16px] text-[#143967]"></p>
      </form>

      <!-- ============ 10. BOTTOM NAVIGATION ============ -->
      <nav class="absolute bottom-[28px] left-0 flex h-[61px] w-[440px] items-center justify-between border-t border-[#6c6c6c]/20 bg-white p-[10px] font-sf text-[13.5px] leading-[19px] text-[#143967]" aria-label="Main navigation">
        <!-- Home -->
        <a href="#" id="navHome" class="flex h-[47px] w-[60px] flex-col items-center justify-center rounded-[5px] no-underline">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="#143967" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round">
            <path d="M4 9l6-5.5L16 9v7.5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V9z" />
            <path d="M8 17.5v-5h4v5" />
          </svg>
          Home
        </a>

        <!-- Inventory (ACTIVE) -->
        <a href="#" id="navInventory" class="flex h-[47px] w-[90px] flex-col items-center justify-center rounded-[100px] bg-[#143967] py-[4px] text-white no-underline">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="#fff" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round">
            <rect x="4" y="2.5" width="12" height="15" rx="2" />
            <path d="M7 6.5h2M7 10h2M7 13.5h2M11.5 6.5H13M11.5 10H13M11.5 13.5H13" />
          </svg>
          Inventory
        </a>

        <!-- Sales -->
        <a href="#" id="navSales" class="flex h-[47px] w-[60px] flex-col items-center justify-center rounded-[5px] no-underline">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="#143967" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round">
            <rect x="4.5" y="2" width="11" height="16" rx="1.8" />
            <path d="M7 4.5h6" />
            <path d="M7 8.5h.01M10 8.5h.01M13 8.5h.01M7 11.5h.01M10 11.5h.01M7 14.5h.01M10 14.5h.01M13 11.5v3" />
          </svg>
          Sales
        </a>

        <!-- Alerts -->
        <a href="#" id="navAlerts" class="flex h-[47px] w-[60px] flex-col items-center justify-center rounded-[5px] no-underline">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="#143967" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round">
            <path d="M5 8a5 5 0 0 1 10 0v3.5l1.5 3h-13L5 11.5V8z" />
            <path d="M8 16.5a2 2 0 0 0 4 0" />
          </svg>
          Alerts
        </a>

        <!-- More -->
        <a href="#" id="navMore" class="flex h-[47px] w-[60px] flex-col items-center justify-center rounded-[5px] no-underline">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="#143967">
            <circle cx="4.5" cy="5" r="1.4" /><circle cx="10" cy="5" r="1.4" /><circle cx="15.5" cy="5" r="1.4" />
            <circle cx="4.5" cy="10" r="1.4" /><circle cx="10" cy="10" r="1.4" /><circle cx="15.5" cy="10" r="1.4" />
            <circle cx="4.5" cy="15" r="1.4" /><circle cx="10" cy="15" r="1.4" /><circle cx="15.5" cy="15" r="1.4" />
          </svg>
          More
        </a>
      </nav>

      </main>

    <!-- All JavaScript lives in stock.js -->
    <script src="stock.js"></script>
  </body>
</html>
